# Cartographer3D host plugin 1.10.1; migrated from scanner on 22 November 2026.
# Firmware remains CARTOGRAPHER V3 6.1.0; connection and measured offsets retained.
# Fresh scan and touch calibration are required before Z homing or printing.
# Original models and the old bed mesh are archived in:
# /home/biqu/cartographer-migration-20261122/config-and-plugin-before.tar.gz

[mcu cartographer]
canbus_uuid: 72663827e7bd
canbus_interface: can0

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 21
z_backlash: 0.00830
macro_prefix: CARTO

[cartographer scan]
mesh_runs: 2
mesh_height: 3

[cartographer touch]
samples: 3

[temperature_sensor cartographer_mcu]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105
